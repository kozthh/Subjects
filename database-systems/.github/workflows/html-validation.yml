name: HTML Validation

on:
  push:
    paths:
      - '**.md'
      - '**.html'
  pull_request:
    paths:
      - '**.md'
      - '**.html'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install HTML validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y htmlhint npm nodejs
          npm install -g htmlhint

      - name: Run HTMLHint on HTML files
        run: |
          htmlhint '**/*.html'

      - name: Check markdown links
        run: |
          # Simple link check for markdown internal links
          grep -r '\[.*\](.*)' --include='*.md' | grep -v '^#' | cut -d'(' -f2 | cut -d')' -f1 | sort -u

      - name: Verify markdown headings match HTML anchors
        run: |
          # Check that markdown headings have proper anchor IDs
          grep -E '^##+' --include='*.md' | sed 's/^##* //' | while read title; do
            echo "Checking: $title"
          done